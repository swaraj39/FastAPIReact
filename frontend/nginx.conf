# ============================================================
# nginx server block for the React SPA + API reverse proxy.
#
# One origin serves BOTH the app and its API:
#   browser -> :80  /            -> static React files
#                   /api/<path>  -> FastAPI container (api:8000)
# Same-origin requests mean CORS never triggers in production.
# ============================================================

server {
    listen 80;
    server_name _;

    # --- Compression: smaller JS/JSON over the wire ---
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # --- API reverse proxy ---
    # The TRAILING SLASH on proxy_pass strips the "/api" prefix:
    #   /api/auth/login  ->  http://api:8000/auth/login
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Hashed build assets never change: cache forever ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA fallback ---
    # react-router URLs like /products don't exist as real files;
    # missing paths fall back to index.html so React takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
