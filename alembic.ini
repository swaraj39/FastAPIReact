# Alembic configuration file.
#
# The database URL is intentionally LEFT EMPTY here: env.py reads it from
# the app's own settings (app/core/config.py -> .env) so there is a single
# source of truth and no credentials are duplicated.
#
# Basic usage (run from the project root, with the venv active):
#   alembic revision --autogenerate -m "message"   # draft a migration
#   alembic upgrade head                           # apply it

[alembic]
# Path to the migration environment + scripts.
script_location = alembic

# Make the `app` package importable when Alembic runs from the project root.
prepend_sys_path = .

# The URL is provided by alembic/env.py from the app settings.
# sqlalchemy.url =

# Print SQL instead of executing (useful for review / CI).
sqlalchemy.echo = false

# Detect column type changes during autogenerate (e.g. Float -> Numeric).
compare_type = true

# Don't let a migration silently overwrite the server_default.
compare_server_default = false

# Standard logging configuration for Alembic messages.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
