# ============================================================
# Production-shaped local stack.
#
#   web (:80)  ->  api (:8000, internal)  ->  Supabase Postgres (cloud)
#                                               |
#                                               +-> Redis Cloud (external)
#
# Only `web` publishes a port. api is reachable ONLY inside the
# compose network. Postgres and Redis live in the cloud and are
# reached over the internet.
#
# Environment variables use ${VAR} substitution from the host .env
# file in this folder - secrets stay OUT of images and OUT of git.
# ============================================================

services:
  # ---- Frontend: nginx serving React + proxying /api to FastAPI ----
  web:
    build: ./frontend
    container_name: fastapi-web
    ports:
      - "80:80"          # the ONLY public entry point of the whole app
    depends_on:
      - api
    restart: unless-stopped

  # ---- Backend API: gunicorn workers behind nginx ----
  api:
    build: .
    container_name: fastapi-api
    expose:
      - "8000"           # internal only - nginx proxies to it
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Containers default to prod (docs hidden). Override per machine by
      # setting ENVIRONMENT in that machine's .env.
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      # External Redis Cloud instance - shared rate-limit counters for every
      # gunicorn worker.
      REDIS_URL: redis://default:YilFHmWaXmMfsILP05yLVEiYba9mzKUW@nautical-taste-macrofine-12507.db.redis.io:10613
      LOG_DIR: ${LOG_DIR:-logs}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
